openapi: 3.0.3
info:
  title: Znero International Customer Edge API
  version: 1.0.0
  description: High-performance customer REST API for SMS submission, balance inspection, pricing estimation, webhooks, and inbound MO messages.
servers:
  - url: https://api.znero.io/api/v1/customer
    description: Production API Server
  - url: http://localhost:8080/api/v1/customer
    description: Local Development Server

security:
  - BearerAuth: []

paths:
  /sms:
    post:
      summary: Submit a single SMS message
      operationId: submitSingleSMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSMSRequest'
      responses:
        '201':
          description: Message accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid or missing API key
        '402':
          description: Insufficient funds or credit limit
        '429':
          description: TPS rate limit exceeded
    get:
      summary: List messages (keyset paginated)
      operationId: listMessages
      parameters:
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated messages list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'

  /sms/bulk:
    post:
      summary: Submit bulk SMS messages (atomic token reservation, max 1000)
      operationId: submitBulkSMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSMSRequest'
      responses:
        '200':
          description: Bulk submission results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSMSResponse'

  /sms/estimate:
    post:
      summary: Pre-send encoding and cost estimate
      operationId: estimateSMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: Pricing and segment calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'

  /sms/{id}:
    get:
      summary: Retrieve single message status by ID
      operationId: getMessageByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSResponse'

  /balance:
    get:
      summary: Get live wallet balance and available credit
      operationId: getBalance
      responses:
        '200':
          description: Wallet balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'

  /rates:
    get:
      summary: List active sell rate card entries
      operationId: listRates
      responses:
        '200':
          description: Active rates list

  /account:
    get:
      summary: Get account profile, status, and usage counters
      operationId: getAccount
      responses:
        '200':
          description: Account details

  /inbound:
    get:
      summary: List incoming mobile-originated messages
      operationId: listInbound
      responses:
        '200':
          description: Inbound messages list

  /webhooks:
    post:
      summary: Create customer webhook endpoint
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook registered with write-only signing secret
    get:
      summary: List configured webhooks
      operationId: listWebhooks
      responses:
        '200':
          description: Webhooks list

  /webhooks/{id}:
    delete:
      summary: Delete webhook endpoint
      operationId: deleteWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook deleted

  /webhooks/{id}/test:
    post:
      summary: Trigger synthetic test event to webhook
      operationId: testWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test event dispatched

  /webhooks/{id}/deliveries:
    get:
      summary: List recent delivery attempts for webhook
      operationId: listWebhookDeliveries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery attempts list

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey

  schemas:
    SubmitSMSRequest:
      type: object
      required:
        - to
        - text
      properties:
        to:
          type: string
          example: "+14155550199"
        from:
          type: string
          example: "ZNERO"
        text:
          type: string
          example: "Your passcode is 981240"
        client_reference:
          type: string
          example: "order-99881"
        validity_seconds:
          type: integer
          default: 86400

    SMSResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, sent, delivered, failed, expired]
        to:
          type: string
        from:
          type: string
        segments:
          type: integer
        encoding:
          type: string
        price:
          type: string
        currency:
          type: string
        client_reference:
          type: string
        created_at:
          type: string
          format: date-time

    BulkSMSRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SubmitSMSRequest'

    BulkSMSResponse:
      type: object
      properties:
        total:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            type: object

    EstimateRequest:
      type: object
      required:
        - to
        - text
      properties:
        to:
          type: string
        from:
          type: string
        text:
          type: string

    EstimateResponse:
      type: object
      properties:
        destination:
          type: string
        encoding:
          type: string
        char_count:
          type: integer
        segment_count:
          type: integer
        max_chars_per_segment:
          type: integer
        estimated_price:
          type: string
        currency:
          type: string

    BalanceResponse:
      type: object
      properties:
        currency:
          type: string
        balance:
          type: string
        active_holds:
          type: string
        available_balance:
          type: string
        credit_limit:
          type: string

    CreateWebhookRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string

    MessageListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SMSResponse'
        next_cursor:
          type: string
        has_more:
          type: boolean
